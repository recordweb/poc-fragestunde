server {
    listen 80;
    server_name vps.recordweb.dev;

    location = /fragenmanagement {
        return 301 /fragenmanagement/;
    }

    location /fragenmanagement/ {
        alias /usr/share/nginx/html/apps/fragenmanagement/frontend/;
        index fragenmanagement.html;
    }

    location /fragenmanagement/api/ {
        proxy_pass http://api:3000/fragenmanagement/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /fragenmanagement/did/ {
        proxy_pass http://api:3000/fragenmanagement/did/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /fragenmanagement/api-docs/ {
        proxy_pass http://api:3000/fragenmanagement/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /antwortmanagement {
        return 301 /antwortmanagement/;
    }

    location /antwortmanagement/ {
        alias /usr/share/nginx/html/apps/antwortmanagement/frontend/;
        index antwortmanagement.html;
    }

    location /antwortmanagement/api/ {
        proxy_pass http://antwort-api:3000/antwortmanagement/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /antwortmanagement/did/ {
        proxy_pass http://antwort-api:3000/antwortmanagement/did/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /antwortmanagement/api-docs/ {
        proxy_pass http://antwort-api:3000/antwortmanagement/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /resolver/parlament/frontend/ {
        alias /usr/share/nginx/html/apps/resolver/frontend/;
        index admin.html;
    }

    location /resolver/parlament/ {
        proxy_pass http://resolver-parlament:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /resolver/bk/frontend/ {
        alias /usr/share/nginx/html/apps/resolver/frontend/;
        index admin.html;
    }

    location /resolver/bk/ {
        proxy_pass http://resolver-bk:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location = /recordfinder {
        return 301 /recordfinder/;
    }

    location /recordfinder/ {
        proxy_pass http://recordfinder:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /rootresolver/admin {
        return 301 /rootresolver/admin/;
    }

    location /rootresolver/admin/ {
        proxy_pass http://admin-app:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /sox/ {
        proxy_pass http://sox:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html/apps;
        index index.html;
    }
}
