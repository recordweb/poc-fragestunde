<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Antwortmanagement · RecordWeb PoC</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1a1a2e; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .test-account { display: inline-block; margin: 4px; padding: 8px 12px; border: 1px solid #999; border-radius: 6px; cursor: pointer; background: #f5f5f7; }
  .test-account:hover { background: #e6e6ea; }
  textarea, select { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
  button { padding: 8px 16px; cursor: pointer; margin-right: 6px; }
  .record { border-left: 4px solid #999; padding: 10px; margin: 10px 0; background: #fafafa; border-radius: 4px; }
  .record.draft { border-color: #e0a800; }
  .record.finalized { border-color: #2b8a3e; }
  .nested { border: 1px solid #e2e2e6; border-radius: 6px; padding: 8px 10px; margin: 8px 0; background: #fff; }
  .nested.finalized { border-left: 3px solid #2b8a3e; }
  .nested.draft { border-left: 3px solid #e0a800; }
  .did { font-size: 0.75rem; color: #666; word-break: break-all; }
  .meta-table { width: 100%; font-size: 0.85rem; margin-top: 8px; border-collapse: collapse; }
  .meta-table td { padding: 4px 6px; border-bottom: 1px solid #eee; vertical-align: top; word-break: break-all; }
  .meta-table td:first-child { font-weight: 600; width: 160px; color: #444; }
  summary { cursor: pointer; font-size: 0.85rem; color: #444; margin-top: 6px; }
  #logoutBtn { float: right; }
  .hidden { display: none; }
  pre { white-space: pre-wrap; font-size: 0.8rem; background: #f0f0f2; padding: 8px; border-radius: 4px; }
  .historyBox { margin-top: 8px; padding: 8px 10px; background: #f0f0f2; border-radius: 4px; font-size: 0.8rem; }
  .historyNode { padding: 6px 0; border-bottom: 1px solid #ddd; word-break: break-all; }
  .historyNode:last-child { border-bottom: none; }
  .badge { display: inline-block; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background: #eee; color: #444; margin-left: 6px; }
</style>
</head>
<body>

<div id="loginView" class="card">
  <h1>Bundeskanzlei · RecordWeb PoC</h1>
  <p>Test-Accounts (klicken zum Einloggen):</p>
  <div id="testAccountsList">Lädt Personen vom Resolver…</div>
</div>

<div id="appView" class="hidden">
  <button id="logoutBtn">Logout</button>
  <h1>Antwortmanagement — <span id="currentUserLabel"></span></h1>

  <div class="card">
    <h2 id="formTitle">Neuer Case</h2>
    <div id="frageAuswahlBlock">
      <label for="frageSelect">Offene Frage aus der Inbox (noch unbeantwortet)</label>
      <select id="frageSelect">
        <option value="">Lädt Fragen aus der Inbox…</option>
      </select>
      <div id="frageVorschau" class="did"></div>
    </div>
    <div id="frageFixiertBlock" class="did hidden"></div>
    <textarea id="antworttext" maxlength="500" rows="4" placeholder="Ihre Antwort (max. 500 Zeichen)"></textarea>
    <button id="saveDraftBtn">Als Draft speichern</button>
    <button id="cancelEditBtn" class="hidden">Abbrechen</button>
  </div>

  <div class="card">
    <h2>Meine Cases</h2>
    <div id="casesList"></div>
  </div>

  <div class="card" id="logsCard" style="display:none;">
    <h2>Server-Logs (Admin)</h2>
    <div id="logsList"></div>
  </div>

</div>

<script>
const CASES_API_BASE = "/antwortmanagement/api/cases";
const RECORDS_API_BASE = "/antwortmanagement/api/records";
const SOX_RECORD_TYPES = ["MiniChat", "TeamsChat"];

const RESOLVER_BASE = "/resolver/bk";
// Die Frage-Auswahl wird bewusst NICHT direkt beim Fragenmanagement abgefragt,
// sondern ausschliesslich aus der eigenen LDN-Inbox aufgebaut — das
// Antwortmanagement kennt eine Frage erst, wenn sie ihm per Notification
// zugestellt wurde.
const INBOX_API_BASE = "/antwortmanagement/api/inbox";

const loginView = document.getElementById("loginView");
const appView = document.getElementById("appView");
const currentUserLabel = document.getElementById("currentUserLabel");
const casesList = document.getElementById("casesList");
const formTitle = document.getElementById("formTitle");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const saveDraftBtn = document.getElementById("saveDraftBtn");
const frageSelect = document.getElementById("frageSelect");
const frageVorschau = document.getElementById("frageVorschau");
const frageAuswahlBlock = document.getElementById("frageAuswahlBlock");
const frageFixiertBlock = document.getElementById("frageFixiertBlock");

// Beim Neuanlegen eines Case wird die Frage frei gewählt. Beim Bearbeiten
// einer bestehenden Antwort ist die Frage bereits als Case-trigger fixiert
// (Hard Link auf die finalisierte Frage) — sie kann dann nicht mehr über
// dieses Formular geändert werden, nur der Antworttext.
let editingAntwortDid = null;

let lastLoadedCases = [];
// offeneFragen: nur die noch NICHT mit einem Case verknüpften Fragen (das ist
// die Auswahlliste, die der Benutzer beim Neuanlegen sieht).
let offeneFragen = [];

function getCurrentUser() {
  const raw = sessionStorage.getItem("currentUser");
  return raw ? JSON.parse(raw) : null;
}

async function login(kuerzel) {
  const res = await fetch(`${RESOLVER_BASE}/1.0/login/${encodeURIComponent(kuerzel)}`);
  if (!res.ok) {
    alert("Login fehlgeschlagen: Person nicht gefunden.");
    return;
  }
  const person = await res.json();
  sessionStorage.setItem("currentUser", JSON.stringify({
    did: person.did,
    label: `${person.name} (${person.role})`,
    kuerzel: person.kuerzel,
    isAdmin: person.kuerzel === "admin"
  }));
  renderApp();
}

function logout() {
  sessionStorage.removeItem("currentUser");
  renderApp();
}

async function loadPersonsFromResolver() {
  const res = await fetch(`${RESOLVER_BASE}/1.0/persons`);
  const persons = await res.json();
  const list = document.getElementById("testAccountsList");
  list.innerHTML = "";
  persons.forEach(p => {
    const div = document.createElement("div");
    div.className = "test-account";
    div.dataset.kuerzel = p.kuerzel;
    div.textContent = `${p.kuerzel} — ${p.name} (${p.role})`;
    list.appendChild(div);
  });
  document.querySelectorAll(".test-account").forEach(el => {
    el.addEventListener("click", () => login(el.dataset.kuerzel));
  });
}

document.getElementById("logoutBtn").addEventListener("click", logout);

// Die Frage wird ausschliesslich über die LDN-Inbox bekannt — keine lokale
// Kopie und kein direkter Zugriff auf das Fragenmanagement vom Frontend aus.
// /offene-fragen filtert bereits serverseitig auf Inbox-Einträge, deren
// object_did noch nicht als trigger.recordDid in einem Case referenziert wird
// (siehe inbox.js).
function inboxEintragZuFrage(entry) {
  const payload = (entry.record && entry.record.payload) || {};
  return {
    did: entry.object_did,
    snapshot_hash: entry.record ? entry.record.snapshot_hash : undefined,
    fragetext: payload.fragetext || "(Frage aktuell nicht auflösbar — Fragenmanagement nicht erreichbar oder Record nicht mehr finalisiert)",
    session: payload.session || "",
    received: entry.received,
    resolved: Boolean(entry.record)
  };
}

async function loadOffeneFragen() {
  try {
    const res = await fetch(`${INBOX_API_BASE}/offene-fragen`);
    offeneFragen = (await res.json()).map(inboxEintragZuFrage);
  } catch (err) {
    offeneFragen = [];
  }
  renderFrageSelect();
}

function renderFrageSelect() {
  frageSelect.innerHTML = "";
  if (!offeneFragen.length) {
    frageSelect.innerHTML = '<option value="">Keine offenen Fragen aus der Inbox verfügbar</option>';
    return;
  }
  frageSelect.appendChild(new Option("— Frage wählen —", ""));
  offeneFragen.forEach(f => {
    const kurz = f.fragetext.length > 70
      ? f.fragetext.slice(0, 70) + "…"
      : f.fragetext;
    frageSelect.appendChild(new Option(`${f.session} — ${kurz}`, f.did));
  });
}

function renderFrageVorschau() {
  const frage = offeneFragen.find(f => f.did === frageSelect.value);
  frageVorschau.innerHTML = frage
    ? `Frage-DID: ${frage.did}<br>Snapshot-Hash: ${frage.snapshot_hash}`
    : "";
}

frageSelect.addEventListener("change", renderFrageVorschau);

async function loadCases() {
  const user = getCurrentUser();
  if (!user) return;
  const res = await fetch(CASES_API_BASE);
  const all = await res.json();
  const mine = user.isAdmin ? all : all.filter(c => c.owner === user.did);
  renderCases(mine);
}

function metaRow(label, value) {
  return `<tr><td>${label}</td><td>${value ?? "–"}</td></tr>`;
}

function caseMetaTable(c) {
  return `
    <table class="meta-table">
      ${metaRow("caseId (did)", c.did)}
      ${metaRow("recordType", c.record_type)}
      ${metaRow("schemaVersion", c.schema_version)}
      ${metaRow("state", c.state)}
      ${metaRow("created", c.created)}
      ${metaRow("finalized", c.finalized)}
      ${metaRow("owner", c.owner)}
      ${metaRow("parents", JSON.stringify(c.parents))}
      ${metaRow("payloadHash", c.payload_hash)}
      ${metaRow("snapshotHash", c.snapshot_hash)}
      ${metaRow("merkleRoot", c.payload.merkleRoot)}
      ${metaRow("signature", c.signature)}
    </table>
    <p><strong>Payload:</strong></p>
    <pre>${JSON.stringify(c.payload, null, 2)}</pre>
  `;
}

function antwortMetaTable(a) {
  return `
    <table class="meta-table">
      ${metaRow("did", a.did)}
      ${metaRow("recordType", a.record_type)}
      ${metaRow("state", a.state)}
      ${metaRow("created", a.record_created)}
      ${metaRow("finalized", a.finalized)}
      ${metaRow("owner", a.owner)}
      ${metaRow("parents", JSON.stringify(a.parents))}
      ${metaRow("payloadHash", a.payload_hash)}
      ${metaRow("snapshotHash", a.snapshot_hash)}
      ${metaRow("signature", a.signature)}
      ${metaRow("correctionReason", a.correction_reason)}
    </table>
  `;
}

function renderFrageDetails(c) {
  const trigger = c.payload.trigger || {};
  if (c.resolvedFrage) {
    const p = c.resolvedFrage.payload || {};
    return `
      <p>${p.fragetext || "(kein Fragetext im aufgelösten Record)"}</p>
      <div class="did">Session: ${p.session || "–"}</div>
      <div class="did">Frage-DID: ${trigger.recordDid}</div>
      <div class="did">snapshotHash (Case-trigger): ${trigger.snapshotHash}</div>
    `;
  }
  return `
    <p><em>Frage aktuell nicht auflösbar (Fragenmanagement nicht erreichbar oder Record nicht mehr gültig).</em></p>
    <div class="did">Frage-DID: ${trigger.recordDid}</div>
    <div class="did">snapshotHash (Case-trigger): ${trigger.snapshotHash}</div>
  `;
}

function renderAntwortDetails(c) {
  const a = c.antwort;
  if (!a) return "<p><em>Keine Antwort verknüpft.</em></p>";
  const nochOffen = (c.payload.workingLinks || []).some(w => w.recordDid === a.did);
  return `
    <div class="nested ${a.state}">
      <strong>Antwort</strong> — <em>${a.state}</em>
      ${nochOffen ? '<span class="badge">soft link — noch nicht in Case übernommen</span>' : ""}
      <p>${a.payload.antworttext}</p>
      <div class="did">Antwort-DID: ${a.did}</div>
      ${a.snapshot_hash ? `<div class="did">Hash: ${a.snapshot_hash}</div>` : ""}
      <div style="margin-top:8px;">
        ${a.state === "draft" ? `
          <button class="editAntwortBtn" data-did="${a.did}">Bearbeiten</button>
          <button class="finalizeAntwortBtn" data-did="${a.did}">Finalisieren</button>
        ` : ""}
        ${a.state === "finalized" ? `<button class="newVersionBtn" data-did="${a.did}">Neue Version starten</button>` : ""}
      </div>
      <details>
        <summary>Antwort-Metadaten anzeigen</summary>
        ${antwortMetaTable(a)}
      </details>
    </div>
  `;
}

function findChatLink(c, recordType) {
  const hardLink = (c.payload.process || []).find((link) =>
    link.recordType === recordType ||
    link.role === recordType
  );

  if (hardLink) {
    return { ...hardLink, type: "hard" };
  }

  const workingLink = (c.payload.workingLinks || []).find((link) =>
    link.targetField === "process" &&
    (link.recordType === recordType || link.role?.startsWith(recordType))
  );

  return workingLink || null;
}

function renderChatDetails(c, recordType) {
  const link = findChatLink(c, recordType);

  if (!link) {
    return `
      <p><em>Für diesen Case wurde noch kein ${recordType}-Record gestartet.</em></p>
    `;
  }

  return `
    <div
      class="nested soxChatDetails"
      data-case-did="${encodeURIComponent(c.did)}"
      data-record-did="${encodeURIComponent(link.recordDid)}"
      data-record-type="${recordType}"
    >
      <strong>${recordType}</strong>
      <span class="badge">${link.type === "hard" ? "hard link" : "working link — noch nicht finalisiert"}</span>
      <div class="did">Record-DID: ${link.recordDid}</div>
      <div class="soxChatContent">Wird beim Öffnen geladen…</div>
    </div>
  `;
}

function renderChatStartButtons(c) {
  if (c.state !== "draft") return "";

  return SOX_RECORD_TYPES.map((recordType) => {
    const existingLink = findChatLink(c, recordType);

    if (existingLink) {
      return `
        <span class="badge">
          ${recordType} bereits verknüpft
        </span>
      `;
    }

    const label = recordType === "MiniChat"
      ? "MiniChat starten"
      : "TeamsChat starten";

    return `
      <button
        class="startChatBtn"
        data-case-did="${encodeURIComponent(c.did)}"
        data-record-type="${recordType}"
      >
        ${label}
      </button>
    `;
  }).join("");
}

async function loadChatDetails(container) {
  if (container.dataset.loaded === "true") return;

  const recordDid = decodeURIComponent(container.dataset.recordDid);
  const content = container.querySelector(".soxChatContent");

  content.textContent = "SoX-Record wird geladen…";

  try {
    const res = await fetch(
      `${CASES_API_BASE}/${container.dataset.caseDid}/chat-records/${encodeURIComponent(recordDid)}`
    );

    if (!res.ok) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.error || `HTTP ${res.status}`);
    }

    const record = await res.json();
    const payload = record.payload || {};

    content.innerHTML = `
      <div class="did">Titel: ${record.title || "–"}</div>
      <div class="did">Status: ${record.status || record.state || "–"}</div>
      <div class="did">RecordType: ${record.recordType || "–"}</div>
      <details>
        <summary>Payload anzeigen</summary>
        <pre>${JSON.stringify(payload, null, 2)}</pre>
      </details>
    `;

    container.dataset.loaded = "true";
  } catch (error) {
    content.innerHTML = `
      <p><em>SoX-Record konnte nicht geladen werden: ${error.message}</em></p>
    `;
  }
}

async function startChat(caseDid, recordType) {
  const label = recordType === "MiniChat" ? "MiniChat" : "TeamsChat";
  const ok = confirm(`${label} für diesen Case starten?`);
  if (!ok) return;

  const res = await fetch(
    `${CASES_API_BASE}/${encodeURIComponent(caseDid)}/chat-records`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ recordType })
    }
  );

  if (!res.ok) {
    const error = await res.json().catch(() => ({}));
    alert(`Fehler: ${error.error || `HTTP ${res.status}`}`);
    return;
  }

  await loadCases();
}

function renderCases(cases) {
  lastLoadedCases = cases;
  casesList.innerHTML = "";
  if (!cases.length) {
    casesList.innerHTML = "<p>Noch keine Cases erfasst.</p>";
    return;
  }
  cases.forEach(c => {
    const bereitZurFinalisierung = c.state === "draft";
    const div = document.createElement("div");
    div.className = "record " + c.state;
    div.innerHTML = `
      <strong>Case</strong> — <em>${c.state}</em><br>
      <span class="did">Case-DID: ${c.did}</span>

      <details>
        <summary>Frage anzeigen</summary>
        ${renderFrageDetails(c)}
      </details>

      <details open>
        <summary>Antwort</summary>
        ${renderAntwortDetails(c)}
      </details>

      <details class="soxChatDetailsGroup">
        <summary>MiniChat anzeigen</summary>
        ${renderChatDetails(c, "MiniChat")}
      </details>

      <details class="soxChatDetailsGroup">
        <summary>TeamsChat anzeigen</summary>
        ${renderChatDetails(c, "TeamsChat")}
      </details>

      <div style="margin-top:8px;">
        ${renderChatStartButtons(c)}
      </div>

      ${c.state === "draft" ? `
        <button class="finalizeCaseBtn" data-did="${c.did}">
          Case finalisieren
        </button>
        <span class="badge">
          prüft beim Klick alle verknüpften Records
        </span>
      ` : ""}

      <details>
        <summary>Alle Case-Metadaten anzeigen</summary>
        ${caseMetaTable(c)}
      </details>
      <details class="historyDetails" data-did="${c.did}">
        <summary>Case-Historie anzeigen</summary>
        <div class="historyBox">Lädt…</div>
      </details>
    `;
    casesList.appendChild(div);
  });
}

function findAntwortInCases(antwortDid) {
  for (const c of lastLoadedCases) {
    if (c.antwort && c.antwort.did === antwortDid) return { caseRecord: c, antwort: c.antwort };
  }
  return null;
}

function startEditAntwort(antwortDid) {
  const found = findAntwortInCases(antwortDid);
  if (!found) return;
  editingAntwortDid = antwortDid;

  // Die Frage ist über den Case bereits fest verlinkt (trigger, Hard Link)
  // und kann beim Bearbeiten der Antwort nicht mehr geändert werden — nur der
  // Antworttext selbst ist editierbar.
  frageAuswahlBlock.classList.add("hidden");
  frageFixiertBlock.classList.remove("hidden");
  frageFixiertBlock.innerHTML = `Verknüpfte Frage (fix, Teil des Case): ${found.caseRecord.payload.trigger.recordDid}`;

  document.getElementById("antworttext").value = found.antwort.payload.antworttext;
  formTitle.textContent = "Antwort bearbeiten";
  saveDraftBtn.textContent = "Änderungen speichern";
  cancelEditBtn.classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelEdit() {
  editingAntwortDid = null;
  document.getElementById("antworttext").value = "";
  frageAuswahlBlock.classList.remove("hidden");
  frageFixiertBlock.classList.add("hidden");
  frageSelect.value = "";
  renderFrageVorschau();
  formTitle.textContent = "Neuer Case";
  saveDraftBtn.textContent = "Als Draft speichern";
  cancelEditBtn.classList.add("hidden");
}

cancelEditBtn.addEventListener("click", cancelEdit);

async function finalizeAntwort(did) {
  const ok = confirm(
    "Dieser Vorgang finalisiert die Antwort unwiderruflich. Der zugehörige Case übernimmt die Antwort danach automatisch als Ergebnis (result) und kann anschliessend finalisiert werden."
  );
  if (!ok) return;
  await fetch(`${RECORDS_API_BASE}/${encodeURIComponent(did)}/finalize`, { method: "PUT" });
  loadCases();
  loadOffeneFragen();
}

async function finalizeCase(did) {
  const ok = confirm("Diesen Case unwiderruflich finalisieren?");
  if (!ok) return;
  const res = await fetch(`${CASES_API_BASE}/${encodeURIComponent(did)}/finalize`, { method: "PUT" });
  if (!res.ok) {
    const err = await res.json();
    alert("Fehler: " + (err.error || JSON.stringify(err)));
    return;
  }
  loadCases();
}

async function startNewVersion(did) {
  const reason = prompt("Grund für die neue Version (optional):", "");
  const res = await fetch(`${RECORDS_API_BASE}/${encodeURIComponent(did)}/new-version`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ correctionReason: reason || null })
  });
  if (!res.ok) {
    const err = await res.json();
    alert("Fehler: " + err.error);
    return;
  }
  loadCases();
  loadOffeneFragen();
}

saveDraftBtn.addEventListener("click", async () => {
  const user = getCurrentUser();
  const antworttext = document.getElementById("antworttext").value.trim();

  if (!antworttext) {
    alert("Bitte einen Antworttext eingeben.");
    return;
  }

  let res;
  if (editingAntwortDid) {
    const payload = {
      antworttext,
      bundesrat_did: user.did,
      beantwortet_am: new Date().toISOString()
    };
    res = await fetch(`${RECORDS_API_BASE}/${encodeURIComponent(editingAntwortDid)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ payload })
    });
  } else {
    const frage = offeneFragen.find(f => f.did === frageSelect.value);
    if (!frage) {
      alert("Bitte eine offene Frage auswählen.");
      return;
    }
    res = await fetch(CASES_API_BASE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        owner: user.did,
        antworttext,
        frage_did: frage.did,
        frage_snapshot_hash: frage.snapshot_hash
      })
    });
  }

  if (!res.ok) {
    const err = await res.json();
    alert("Fehler: " + JSON.stringify(err.details || err.error));
    return;
  }

  cancelEdit();
  loadCases();
  loadOffeneFragen();
});

casesList.addEventListener("click", (e) => {
  if (e.target.classList.contains("finalizeAntwortBtn")) {
    finalizeAntwort(e.target.dataset.did);
  }
  if (e.target.classList.contains("finalizeCaseBtn")) {
    finalizeCase(e.target.dataset.did);
  }
  if (e.target.classList.contains("newVersionBtn")) {
    startNewVersion(e.target.dataset.did);
  }
  if (e.target.classList.contains("editAntwortBtn")) {
    startEditAntwort(e.target.dataset.did);
  }
  if (e.target.classList.contains("startChatBtn")) {
    startChat(
      decodeURIComponent(e.target.dataset.caseDid),
      e.target.dataset.recordType
    );
  }
});

casesList.addEventListener("toggle", async (e) => {
    if (
      e.target.classList.contains("soxChatDetailsGroup") &&
      e.target.open
    ) {
      const container = e.target.querySelector(".soxChatDetails");
      if (container) {
        await loadChatDetails(container);
      }
      return;
    }
  if (!e.target.classList.contains("historyDetails")) return;
  if (!e.target.open) return;

  const did = e.target.dataset.did;
  const box = e.target.querySelector(".historyBox");
  box.textContent = "Lädt…";

  const res = await fetch(`${CASES_API_BASE.replace("/cases", "/records")}/${encodeURIComponent(did)}/history`);
  const history = await res.json();

  box.innerHTML = `
    <p><strong>Version Graph (${history.length} Snapshot${history.length !== 1 ? "s" : ""}):</strong></p>
    ${history.map((s, i) => `
      <div class="historyNode">
        <strong>${i + 1}. [${s.state}]</strong><br>
        snapshotHash: ${s.snapshot_hash}<br>
        parents: ${JSON.stringify(s.parents)}<br>
        created: ${s.created}
        ${s.finalized ? `<br>finalized: ${s.finalized}` : ""}
        ${s.correction_reason ? `<br>correctionReason: ${s.correction_reason}` : ""}
      </div>
    `).join("")}
  `;
}, true);

async function loadLogs() {
  const res = await fetch("/antwortmanagement/api/logs");
  const logs = await res.json();
  const list = document.getElementById("logsList");
  list.innerHTML = logs.map(l =>
    `<div class="did">[${l.created}] ${l.message}</div>`
  ).join("");
}

function renderApp() {
  const user = getCurrentUser();
  if (user) {
    loginView.classList.add("hidden");
    appView.classList.remove("hidden");
    currentUserLabel.textContent = user.label;
    loadOffeneFragen();
    loadCases();
  } else {
    loginView.classList.remove("hidden");
    appView.classList.add("hidden");
  }
  const logsCard = document.getElementById("logsCard");
  if (user && user.isAdmin) {
    logsCard.style.display = "block";
    loadLogs();
  } else {
    logsCard.style.display = "none";
  }
}

loadPersonsFromResolver();
renderApp();
</script>
</body>
</html>
